spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: PayGate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/paygatedb}
    username: ${DB_USER:}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  master-key: ${VAULT_MASTER_KEY:}

payment:
  simulator:
    poll-interval-ms: 1000
    chaos-mode: NORMAL
    method:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90

      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95

      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

jwt:
  secret_key: ${JWT_SECRET_KEY:}

server:
  port: 8081

error:
  include-stacktrace: never
  include-message: never
  include-binding-errors: never